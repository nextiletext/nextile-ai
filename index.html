<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - GitHub Pages</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for formatting Markdown/code blocks -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header / API Key Bar -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="text-lg font-bold">AI Chatbot</h1>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key..." 
                class="bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 w-full sm:w-64">
            <button onclick="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded text-sm font-medium transition">Save</button>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm">AI</div>
            <div class="bg-gray-800 border border-gray-700 p-3 rounded-2xl max-w-[80%] text-sm leading-relaxed">
                Hello! Enter your Gemini API key above, then type a message below to start chatting.
            </div>
        </div>
    </main>

    <!-- Input Form Area -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4">
        <form id="chatForm" onsubmit="sendMessage(event)" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-100 focus:outline-none focus:border-indigo-500">
            <button type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-lg font-medium text-sm transition flex items-center justify-center">
                Send
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Load saved API key from localStorage if available
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved to browser local storage!');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('API Key removed.');
            }
        }

        // Conversation history array to keep context
        let chatHistory = [];

        async function sendMessage(event) {
            event.preventDefault();
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();

            if (!message) return;

            if (!apiKey) {
                alert('Please enter and save your Gemini API key first!');
                return;
            }

            // Append User Message to UI
            appendMessage(message, 'user');
            inputField.value = '';

            // Push to history
            chatHistory.push({ role: "user", parts: [{ text: message }] });

            // Create placeholder for AI response
            const aiMessageId = 'ai-msg-' + Date.now();
            appendMessage('Thinking...', 'ai', aiMessageId);

            try {
                // Call Gemini API (using gemini-2.5-flash as a fast, free-tier friendly model)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiResponseText = data.candidates[0].content.parts[0].text;
                
                // Push AI response to history
                chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });

                // Update UI with formatted Markdown response
                const messageElement = document.getElementById(aiMessageId);
                messageElement.innerHTML = marked.parse(aiResponseText);
                scrollToBottom();

            } catch (error) {
                const messageElement = document.getElementById(aiMessageId);
                messageElement.innerHTML = `<span class="text-red-400">Error: ${error.message}</span>`;
            }
        }

        function appendMessage(text, sender, id = '') {
            const chatContainer = document.getElementById('chatContainer');
            const isUser = sender === 'user';

            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${isUser ? 'bg-gray-700 text-gray-200' : 'bg-indigo-600 text-white'}`;
            avatar.innerText = isUser ? 'You' : 'AI';

            const bubble = document.createElement('div');
            if (id) bubble.id = id;
            bubble.className = `p-3 rounded-2xl max-w-[80%] text-sm leading-relaxed ${isUser ? 'bg-indigo-600 text-white' : 'bg-gray-800 border border-gray-700 text-gray-100'}`;
            
            if (sender === 'user') {
                bubble.innerText = text;
            } else if (text === 'Thinking...') {
                bubble.innerText = text;
            } else {
                bubble.innerHTML = marked.parse(text);
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
